<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>DS4E Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f2f2f7;color:#1c1c1e;overscroll-behavior:none;}

/* ── HEADER ── */
.app-header{background:#4c4c4c;padding:12px 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;flex-shrink:0;}
.ds4e-badge{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.ds4e-badge-l{background:#ef4a23;color:#fff;font-weight:700;font-size:13px;padding:4px 7px;border-radius:4px 0 0 4px;line-height:1;}
.ds4e-badge-r{background:#fff;color:#4c4c4c;font-weight:700;font-size:9px;padding:4px 5px;border-radius:0 4px 4px 0;line-height:1.2;text-transform:uppercase;letter-spacing:0.5px;}
.header-title{color:#fff;font-size:14px;font-weight:600;flex:1;}
.back-btn{color:#ef4a23;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:4px;margin-right:6px;}

/* ── BOTTOM NAV ── */
.bottom-nav{display:flex;background:#fff;border-top:0.5px solid #ddd;padding:6px 0 10px;flex-shrink:0;position:sticky;bottom:0;z-index:100;}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#888;cursor:pointer;padding:4px 0;}
.nav-tab.active{color:#ef4a23;}
.nav-tab svg{width:22px;height:22px;}

/* ── MAP VIEW ── */
#map-view{height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.map-hint{padding:6px 14px;font-size:11px;color:#888;background:#fff;border-bottom:0.5px solid #f0f0f0;flex-shrink:0;}
.map-container{flex:1;min-height:0;overflow:auto;display:flex;align-items:flex-start;justify-content:center;}
#us-map-container{width:100%;display:flex;align-items:center;}
.map-legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:8px 14px;background:#fff;border-top:0.5px solid #e5e5e5;font-size:11px;color:#555;flex-shrink:0;}
.map-legend-item{display:flex;align-items:center;gap:5px;}
.map-legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0;}

/* ── LIST VIEW ── */
#list-view{display:none;min-height:100vh;}
.search-section{background:#fff;border-bottom:0.5px solid #e0e0e0;padding:10px 12px 8px;position:sticky;top:56px;z-index:99;}
.search-wrap{position:relative;}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#888;}
.search-input{width:100%;border:0.5px solid #ddd;border-radius:10px;padding:8px 12px 8px 34px;font-size:15px;background:#f2f2f7;color:#1c1c1e;outline:none;}
.search-input::placeholder{color:#aaa;}
.filter-row{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.chip{border-radius:20px;padding:5px 12px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent;cursor:pointer;flex-shrink:0;}
.chip-all{background:#ef4a23;color:#fff;border-color:#ef4a23;}
.chip-all.inactive{background:#fff;color:#ef4a23;border-color:#ef4a23;}
.chip-t4{background:#7c2d12;color:#fff;border-color:#7c2d12;}
.chip-t4.inactive{background:#fff;color:#7c2d12;border-color:#7c2d12;}
.chip-t3{background:#ef4a23;color:#fff;border-color:#ef4a23;}
.chip-t3.inactive{background:#fff;color:#ef4a23;border-color:#ef4a23;}
.chip-t2{background:#f9c6a4;color:#993c1d;border-color:#d97a4a;}
.chip-t2.inactive{background:#fff;color:#993c1d;border-color:#d97a4a;}
.chip-t1{background:#6290c8;color:#fff;border-color:#6290c8;}
.chip-t1.inactive{background:#fff;color:#185fa5;border-color:#6290c8;}
.chip-t0{background:#b8b6b6;color:#fff;border-color:#aaa;}
.chip-t0.inactive{background:#fff;color:#555;border-color:#aaa;}
.chip-tnone{background:#888;color:#fff;border-color:#888;}
.chip-tnone.inactive{background:#fff;color:#555;border-color:#aaa;}
.filter-group-label{font-size:10px;color:#aaa;padding:4px 2px 0;white-space:nowrap;flex-shrink:0;align-self:center;}
.section-label{background:#f2f2f7;padding:5px 16px;font-size:12px;color:#888;font-weight:500;border-bottom:0.5px solid #e5e5e5;}
.state-item{background:#fff;border-bottom:0.5px solid #f0f0f0;padding:10px 14px 10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.state-item:active{background:#f8f8f8;}
.state-icon-wrap{width:40px;height:40px;flex-shrink:0;}
.state-icon-wrap img{width:40px;height:40px;object-fit:contain;display:block;}
.state-icon-dc{width:40px;height:40px;background:#4c4c4c;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;}
.state-info{flex:1;min-width:0;}
.state-name-row{display:flex;align-items:baseline;justify-content:space-between;gap:6px;}
.state-name{font-size:15px;font-weight:500;color:#1c1c1e;}
.state-updated{font-size:10px;color:#aaa;white-space:nowrap;}
.tier-row{display:flex;align-items:center;gap:3px;margin-top:3px;flex-wrap:wrap;}
.tdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block;}
.dt4{background:#7c2d12;}.dt3{background:#ef4a23;}.dt2{background:#f9c6a4;border:1px solid #d97a4a;}
.dt1{background:#6290c8;}.dt0{background:#b8b6b6;}.dtnone{background:#b8b6b6;}
.tier-text{font-size:10px;color:#888;}
.goal-sep{font-size:10px;color:#ccc;margin:0 1px;}
.goal-dot{width:9px;height:9px;border-radius:50%;border:1.5px dashed;flex-shrink:0;display:inline-block;}
.chevron{color:#c7c7cc;flex-shrink:0;}
.std-status-badge{font-size:9px;font-weight:600;padding:2px 6px;border-radius:10px;margin-left:4px;}
.ssb-process{background:#ddeaf8;color:#185fa5;}
.ssb-finalized{background:#e1f5ee;color:#0f6e56;}
.ssb-pause{background:#fef3e2;color:#92400e;}
.ssb-watch{background:#fde8e8;color:#a32d2d;}
.ssb-draft{background:#f3e8ff;color:#6b21a8;}
.list-legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:10px 14px;background:#fff;border-top:0.5px solid #f0f0f0;font-size:11px;color:#666;}
.list-legend-item{display:flex;align-items:center;gap:4px;}
.empty{text-align:center;padding:48px 24px;color:#aaa;}

/* ── DETAIL VIEW ── */
#detail-view{display:none;flex-direction:column;min-height:100vh;}
.detail-hero{background:#4c4c4c;padding:14px 16px 16px;flex-shrink:0;}
.detail-state-icon{width:64px;height:64px;margin-bottom:10px;display:block;}
.detail-state-icon img{width:64px;height:64px;object-fit:contain;display:block;}
.detail-dc-icon{width:64px;height:64px;background:#ef4a23;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:22px;margin-bottom:10px;}
.detail-state-name{color:#fff;font-size:20px;font-weight:600;}
.detail-agency{color:#b8b6b6;font-size:11px;margin-top:2px;}
.detail-updated{color:#f9c6a4;font-size:11px;margin-top:4px;display:flex;align-items:center;gap:4px;}

/* ── TAB BAR ── */
.tab-bar{display:flex;background:#fff;border-bottom:0.5px solid #e0e0e0;overflow-x:auto;flex-shrink:0;scrollbar-width:none;position:sticky;top:56px;z-index:98;}
.tab-bar::-webkit-scrollbar{display:none;}
.tab-btn{padding:10px 16px;font-size:13px;font-weight:500;color:#888;white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent;flex-shrink:0;}
.tab-btn.active{color:#ef4a23;border-bottom-color:#ef4a23;}
.tab-content{display:none;padding:12px;flex-direction:column;gap:10px;}
.tab-content.active{display:flex;}

/* ── CARDS ── */
.card{background:#fff;border-radius:12px;border:0.5px solid #e5e5e5;overflow:hidden;}
.card-header{padding:9px 14px;border-bottom:0.5px solid #f0f0f0;font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.5px;background:#fafafa;}
.card-row{padding:8px 14px;border-bottom:0.5px solid #f5f5f5;}
.card-row:last-child{border-bottom:none;}
.row-label{font-size:11px;color:#888;margin-bottom:2px;}
.row-value{font-size:13px;color:#1c1c1e;line-height:1.5;}
.row-value.muted{color:#aaa;font-style:italic;}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;}
.pill{display:inline-block;border-radius:5px;padding:3px 8px;font-size:11px;font-weight:500;}
.pill-t4{background:#7c2d12;color:#fff;}.pill-t3{background:#ef4a23;color:#fff;}
.pill-t2{background:#f9c6a4;color:#993c1d;}.pill-t1{background:#ddeaf8;color:#185fa5;}
.pill-t0{background:#f0f0f0;color:#666;}.pill-tnone{background:#f0f0f0;color:#666;}
.pill-goal{background:#e1f5ee;color:#0f6e56;border:1px dashed #66c2a4;}

/* ── OVERVIEW STATUS CARD ── */
.overview-status{display:flex;align-items:center;gap:10px;padding:12px 14px;}
.ov-status-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.ov-status-label{font-size:14px;font-weight:600;color:#1c1c1e;}
.ov-status-sub{font-size:11px;color:#888;margin-top:1px;}

/* ── STANDARDS STATUS ── */
.std-status-row{display:flex;align-items:flex-start;gap:10px;padding:8px 14px;border-bottom:0.5px solid #f5f5f5;}
.std-status-row:last-child{border-bottom:none;}
.std-status-indicator{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px;}
.si-process{background:#6290c8;}.si-finalized{background:#66c2a4;}.si-pause{background:#f9c6a4;}
.si-watch{background:#ef4a23;}.si-draft{background:#8B2D76;}.si-stable{background:#b8b6b6;}
.std-status-info{flex:1;}
.std-status-title{font-size:13px;font-weight:500;color:#1c1c1e;}
.std-status-detail{font-size:11px;color:#888;margin-top:2px;line-height:1.4;}

/* ── TIMELINE ── */
.timeline-item{padding:8px 14px;border-bottom:0.5px solid #f5f5f5;display:grid;grid-template-columns:52px 1fr;gap:8px;}
.timeline-item:last-child{border-bottom:none;}
.tl-year{font-size:11px;font-weight:600;color:#ef4a23;padding-top:1px;}
.tl-text{font-size:12px;color:#444;line-height:1.5;}

/* ── COURSE CODES ── */
.code-row{padding:7px 14px;border-bottom:0.5px solid #f5f5f5;display:flex;gap:10px;align-items:flex-start;}
.code-row:last-child{border-bottom:none;}
.code-num{font-size:11px;font-weight:600;color:#6290c8;min-width:50px;font-family:monospace;padding-top:1px;flex-shrink:0;}
.code-title{font-size:12px;color:#333;line-height:1.4;}

/* ── STD SUBJECT ROW ── */
.std-row{padding:7px 14px;border-bottom:0.5px solid #f5f5f5;display:grid;grid-template-columns:60px 1fr;gap:8px;align-items:start;}
.std-row:last-child{border-bottom:none;}
.std-subj{font-size:11px;font-weight:600;color:#555;padding-top:1px;}
.std-detail{font-size:12px;color:#444;line-height:1.4;}
.std-year{color:#ef4a23;font-weight:600;}
.std-rev{display:inline-block;margin-top:2px;font-size:10px;color:#888;font-style:italic;}
.std-rev.in-rev{color:#0f6e56;}

/* ── LOADING ── */
.loading-card{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;gap:14px;color:#888;font-size:14px;}
.loading-spinner{width:28px;height:28px;border:3px solid #f0f0f0;border-top-color:#ef4a23;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── PRIVATE DATA CARD ── */
.card-private{border-left:3px solid #66c2a4;}
.private-badge{display:inline-flex;align-items:center;gap:5px;color:#4c8c7a;font-weight:600;font-size:12px;}
.contact-row{padding:8px 14px;border-bottom:0.5px solid #f0f0f0;}
.contact-row:last-child{border-bottom:none;}
.contact-name{font-weight:600;font-size:14px;color:#1c1c1e;}
.contact-title{font-size:12px;color:#666;margin-top:2px;}
.contact-email{font-size:12px;color:#6290c8;margin-top:2px;}
.contact-role{display:inline-block;font-size:11px;background:#f2f2f7;color:#666;border-radius:10px;padding:2px 8px;margin-top:4px;}
.contact-notes{font-size:12px;color:#444;margin-top:4px;padding-top:4px;border-top:0.5px solid #f0f0f0;}

/* ── LOCK BUTTON ── */
.lock-btn{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:16px;cursor:pointer;font-size:12px;font-weight:500;border:1px solid rgba(255,255,255,0.3);color:rgba(255,255,255,0.8);transition:all 0.2s;}
.lock-btn:hover{background:rgba(255,255,255,0.15);}
.lock-btn.unlocked{color:#66c2a4;border-color:#66c2a4;}
.lock-btn svg{width:14px;height:14px;}

/* ── PASSWORD MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;}
.modal-box{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.2);}
.modal-title{font-size:17px;font-weight:700;color:#1c1c1e;margin-bottom:6px;}
.modal-sub{font-size:13px;color:#666;margin-bottom:20px;}
.modal-input{width:100%;border:1.5px solid #ddd;border-radius:10px;padding:11px 14px;font-size:15px;outline:none;transition:border-color 0.2s;}
.modal-input:focus{border-color:#ef4a23;}
.modal-error{color:#e05252;font-size:12px;margin-top:8px;min-height:16px;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-btn{flex:1;padding:12px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:none;}
.modal-btn-cancel{background:#f2f2f7;color:#1c1c1e;}
.modal-btn-submit{background:#ef4a23;color:#fff;}
.modal-btn-submit:disabled{opacity:0.5;cursor:not-allowed;}

/* ── CONF EVENT ── */
.tl-conf{border-left:3px solid #66c2a4;padding-left:8px;margin-top:4px;}
.tl-conf-label{font-size:11px;color:#4c8c7a;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}

/* ── USEFUL LINKS ── */
.useful-link{display:inline-flex;align-items:center;gap:5px;color:#6290c8;text-decoration:none;font-size:13px;margin-top:4px;}
.useful-link:hover{text-decoration:underline;}
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
</head>
<body>

<!-- ═══════════════════════════ MAP VIEW ═══════════════════════════ -->
<div id="map-view">
  <div class="app-header">
    <div class="ds4e-badge">
      <div class="ds4e-badge-l">DS4E</div>
      <div class="ds4e-badge-r">National<br>Tracker</div>
    </div>
  </div>
  <div class="map-hint">Tap a state to view details</div>
  <div class="map-container">
    <div id="us-map-container"></div>
  </div>
  <div class="map-legend">
    <div class="map-legend-item"><div class="map-legend-dot" style="background:#7c2d12;"></div>Tier 4</div>
    <div class="map-legend-item"><div class="map-legend-dot" style="background:#ef4a23;"></div>Tier 3</div>
    <div class="map-legend-item"><div class="map-legend-dot" style="background:#f9c6a4;border:1px solid #d97a4a;"></div>Tier 2</div>
    <div class="map-legend-item"><div class="map-legend-dot" style="background:#6290c8;"></div>Tier 1</div>
    <div class="map-legend-item"><div class="map-legend-dot" style="background:#b8b6b6;"></div>None</div>
  </div>
  <div class="bottom-nav">
    <div class="nav-tab active" id="nav-map" onclick="switchTab('map')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3V6z"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
      Map
    </div>
    <div class="nav-tab" id="nav-states" onclick="switchTab('states')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      States
    </div>
  </div>
</div>

<!-- ═══════════════════════════ LIST VIEW ═══════════════════════════ -->
<div id="list-view">
  <div class="app-header">
    <div class="ds4e-badge">
      <div class="ds4e-badge-l">DS4E</div>
      <div class="ds4e-badge-r">National<br>Tracker</div>
    </div>
  </div>
  <div class="search-section">
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" id="search-input" type="search" placeholder="Search states..." oninput="filterStates()">
    </div>
    <div class="filter-row" id="filter-row"></div>
  </div>
  <div id="state-list"></div>
  <div class="list-legend">
    <div class="list-legend-item"><span class="tdot dt4"></span>Tier 4</div>
    <div class="list-legend-item"><span class="tdot dt3"></span>Tier 3</div>
    <div class="list-legend-item"><span class="tdot dt2"></span>Tier 2</div>
    <div class="list-legend-item"><span class="tdot dt1"></span>Tier 1</div>
    <div class="list-legend-item"><span class="tdot dtnone"></span>None</div>
    <div class="list-legend-item"><span class="goal-dot" style="border-color:#888;"></span>Goal</div>
  </div>
  <div class="bottom-nav">
    <div class="nav-tab" id="nav-map2" onclick="switchTab('map')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3V6z"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
      Map
    </div>
    <div class="nav-tab active" id="nav-states2" onclick="switchTab('states')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      States
    </div>
  </div>
</div>

<!-- ═══════════════════════════ DETAIL VIEW ═══════════════════════════ -->
<div id="detail-view">
  <div class="app-header">
    <div class="back-btn" onclick="goBack()">
      <svg width="10" height="16" viewBox="0 0 10 16" fill="none"><path d="M8 2L2 8L8 14" stroke="#ef4a23" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back
    </div>
    <div class="header-title" id="detail-header-name"></div>
    <div class="lock-btn" id="lock-btn" onclick="showPasswordModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Private
    </div>
  </div>
  <div id="detail-hero-area"></div>
  <div class="tab-bar" id="detail-tab-bar"></div>
  <div id="detail-tab-contents"></div>
  <div style="height:24px;"></div>
</div>

<script>
// ── Config ───────────────────────────────────────────────────────────────────
var PUBLIC_SHEET_BASE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRU0_I99UuZvfBam8y_Z2wGwbDfsL5A0CB5MYNogbPfSWnnLIpSQP-sCtgR3Uwz2vByq7thFBIp-MbB/pub?output=csv&sheet=";

// ── CSV parser ───────────────────────────────────────────────────────────────
function parseCSV(text) {
  var rows = [];
  var row = [];
  var field = "";
  var inQuote = false;
  var i = 0;
  while (i < text.length) {
    var c = text[i];
    if (inQuote) {
      if (c === '"') {
        if (i + 1 < text.length && text[i + 1] === '"') { field += '"'; i += 2; }
        else { inQuote = false; i++; }
      } else { field += c; i++; }
    } else {
      if (c === '"') { inQuote = true; i++; }
      else if (c === ',') { row.push(field); field = ""; i++; }
      else if (c === '\r' || c === '\n') {
        row.push(field); rows.push(row); row = []; field = ""; i++;
        if (c === '\r' && i < text.length && text[i] === '\n') i++;
      } else { field += c; i++; }
    }
  }
  if (row.length > 0 || field) { row.push(field); rows.push(row); }
  return rows;
}

// ── Public sheet parser ───────────────────────────────────────────────────────
function parsePublicSheet(csv) {
  var rows = parseCSV(csv);
  var d = {
    updated:"", agency:"", typeAdoption:"", contentAreas:"", gradeBand:"",
    comments:"", usefulLinks:"", usefulLinksUrl:"",
    superintendent:"", party:"", rural:"", strategicPlan:"",
    mathStd:"", mathStdUrl:"", elaStd:"", ssStd:"",
    scienceStd:"", csStd:"", cteStd:"",
    linkStandards:"", revisionCycle:"", stdComments:"", stdResources:"",
    courseCodeUpdated:"", addedToCatalog:"", linkCatalog:"",
    courseCodesRaw:"", courseCategory:"",
    gradCredits:"", gradCoursework:"", gradReqResources:"",
    timeline:[]
  };
  var section = "";
  var inEvents = false;
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var c0 = (r[0] || "").trim();
    var c1 = (r[1] || "").trim();
    var c2 = (r[2] || "").trim();
    if (c0 === "ADOPTION")              { section = "adoption"; inEvents = false; continue; }
    if (c0 === "EDUCATIONAL LANDSCAPE") { section = "landscape"; inEvents = false; continue; }
    if (c0 === "EVENTS TRACKER")        { section = "events"; inEvents = false; continue; }
    if (c0 === "Field" && c1 === "Value") continue;
    if (section === "events" && c0 === "Year" && c1 === "Event") { inEvents = true; continue; }
    if (section === "events" && inEvents && c0 && c0 !== "[SY XXXX]") {
      d.timeline.push({year:c0, event:c1, url:c2}); continue;
    }
    if (section === "adoption") {
      if (c0 === "Date Updated")               d.updated = c1;
      else if (c0 === "State K-12 Education Agency") d.agency = c1;
      else if (c0 === "Type of Adoption")      d.typeAdoption = c1;
      else if (c0 === "Content Areas")         d.contentAreas = c1;
      else if (c0 === "Grade Band")            d.gradeBand = c1;
      else if (c0 === "Additional Comments")   d.comments = c1;
      else if (c0 === "Useful Links")          { d.usefulLinks = c1; d.usefulLinksUrl = c2; }
    } else if (section === "landscape") {
      if      (c0 === "Superintendent / Commissioner") d.superintendent = c1;
      else if (c0 === "Political Party")               d.party = c1;
      else if (c0 === "Rural (30%+ population)")       d.rural = c1;
      else if (c0 === "Current Strategic Plan")        d.strategicPlan = c1;
      else if (c0 === "Link to Standards")             d.linkStandards = c2 || c1;
      else if (c0 === "Math Standards")                { d.mathStd = c1; d.mathStdUrl = c2; }
      else if (c0 === "English Standards")             d.elaStd = c1;
      else if (c0 === "Social Studies Standards")      d.ssStd = c1;
      else if (c0 === "Science Standards")             d.scienceStd = c1;
      else if (c0 === "Computer Science Standards")    d.csStd = c1;
      else if (c0 === "CTE Standards")                 d.cteStd = c1;
      else if (c0 === "Standards Revision Cycle")      d.revisionCycle = c1;
      else if (c0 === "Additional Comments on Standards") d.stdComments = c1;
      else if (c0 === "Additional Standards Resources")   d.stdResources = c1;
      else if (c0 === "Course Code Updated")              d.courseCodeUpdated = c1;
      else if (c0 === "Added to State Course Catalog")    d.addedToCatalog = c1;
      else if (c0 === "Link to Course Catalog")           d.linkCatalog = c2 || c1;
      else if (c0 === "State Course Code(s)")             d.courseCodesRaw = c1;
      else if (c0 === "State Course Category")            d.courseCategory = c1;
      else if (c0 === "Math Graduation Credits")          d.gradCredits = c1;
      else if (c0 === "Math Graduation Coursework")       d.gradCoursework = c1;
      else if (c0 === "Graduation Req. Resources")        d.gradReqResources = c1;
    }
  }
  return d;
}

// ── Private sheet parser ──────────────────────────────────────────────────────
function parsePrivateSheet(rows) {
  var d = { internal:"", contacts:[], confEvents:[] };
  var section = "";
  var inContacts = false;
  var inEvents = false;
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var c0 = r[0] ? String(r[0]).trim() : "";
    if (c0 === "INTERNAL INFORMATION")      { section = "internal"; continue; }
    if (c0 === "POINTS OF CONTACT")         { section = "contacts"; inContacts = false; continue; }
    if (c0 === "CONFIDENTIAL EVENTS TRACKER") { section = "events"; inEvents = false; continue; }
    if (section === "internal" && c0 === "Internal Notes") d.internal = String(r[1] || "").trim();
    if (section === "contacts") {
      if (c0 === "First Name") { inContacts = true; continue; }
      if (inContacts && c0 && c0 !== "[First]") {
        d.contacts.push({
          first: c0, last: String(r[1]||"").trim(),
          title: String(r[2]||"").trim(), org: String(r[3]||"").trim(),
          email: String(r[4]||"").trim(), role: String(r[5]||"").trim(),
          notes: String(r[6]||"").trim()
        });
      }
    }
    if (section === "events") {
      if (c0 === "Year") { inEvents = true; continue; }
      if (inEvents && c0 && c0 !== "[SY XXXX]") {
        d.confEvents.push({year:c0, notes:String(r[1]||"").trim(), url:String(r[2]||"").trim()});
      }
    }
  }
  return d;
}

// ── Course codes parser ───────────────────────────────────────────────────────
function parseCourseCodesRaw(raw) {
  if (!raw) return [];
  var lines = raw.split("\n");
  var result = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var spaceIdx = line.indexOf(" ");
    if (spaceIdx > 0) {
      var code = line.substring(0, spaceIdx);
      var rest = line.substring(spaceIdx + 1).trim();
      rest = rest.replace(/\s*\[SY[\s\d\-current]+\]/gi, "").trim();
      result.push({code: code, title: rest});
    } else { result.push({code:"", title:line}); }
  }
  return result;
}

// ── Fetch: public sheet ───────────────────────────────────────────────────────
function fetchStateData(stateName, callback) {
  var url = PUBLIC_SHEET_BASE + encodeURIComponent(stateName);
  fetch(url)
    .then(function(r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })
    .then(function(csv) { callback(parsePublicSheet(csv), null); })
    .catch(function(err) { callback(null, err.message); });
}

// ── Fetch: private data via proxy ─────────────────────────────────────────────
function fetchPrivateData(password, callback) {
  fetch(PROXY_URL, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({password: password})
  })
    .then(function(r) { return r.json(); })
    .then(function(json) {
      if (json.error) { callback(null, json.error); return; }
      var parsed = {};
      var stateData = json.states || {};
      var keys = Object.keys(stateData);
      for (var i = 0; i < keys.length; i++) {
        parsed[keys[i]] = parsePrivateSheet(stateData[keys[i]]);
      }
      callback(parsed, null);
    })
    .catch(function(err) { callback(null, err.message); });
}

// ── Tier helpers ──────────────────────────────────────────────────────────────
function tierKey(t) {
  if (!t || t === "None") return "tnone";
  var m = t.match(/Tier (\d)/);
  if (!m) return "tnone";
  var n = parseInt(m[1]);
  return n >= 4 ? "t4" : n === 3 ? "t3" : n === 2 ? "t2" : n === 1 ? "t1" : n === 0 ? "t0" : "tnone";
}
function tierLabel(t) {
  if (!t || t === "None") return "None";
  var m = t.match(/Tier (\d)/); return m ? "Tier " + m[1] : "None";
}
function goalDotColor(tk) {
  var c = {t4:"#7c2d12",t3:"#ef4a23",t2:"#d97a4a",t1:"#6290c8",t0:"#b8b6b6",tnone:"#aaa"};
  return c[tk] || "#aaa";
}
function uniqueMap(arr, fn) {
  var seen = {}, result = [];
  arr.forEach(function(x) { var v = fn(x); if (!seen[v]) { seen[v] = true; result.push(v); } });
  return result;
}
function esc(s) {
  if (!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── Standards status helpers ──────────────────────────────────────────────────
function stdStatusClass(status) {
  if (!status) return "si-stable";
  var s = status.toLowerCase();
  if (s.indexOf("process") >= 0) return "si-process";
  if (s.indexOf("finalized") >= 0) return "si-finalized";
  if (s.indexOf("pause") >= 0) return "si-pause";
  if (s.indexOf("watch") >= 0) return "si-watch";
  if (s.indexOf("draft") >= 0) return "si-draft";
  return "si-stable";
}
function stdBadgeClass(status) {
  if (!status) return "";
  var s = status.toLowerCase();
  if (s.indexOf("process") >= 0) return "ssb-process";
  if (s.indexOf("finalized") >= 0) return "ssb-finalized";
  if (s.indexOf("pause") >= 0) return "ssb-pause";
  if (s.indexOf("watch") >= 0) return "ssb-watch";
  if (s.indexOf("draft") >= 0) return "ssb-draft";
  return "";
}
function mathStatusLabel(s) {
  if (!s) return "";
  var map = {"In Process":"In Process","Finalized":"Finalized","Pause":"Paused",
             "To Watch":"To Watch","Draft / Public Comment":"Draft",
             "Recently Revised":"Recently Revised","Stable":"Stable"};
  for (var k in map) { if (s.indexOf(k) >= 0) return map[k]; }
  return s.split("(")[0].trim();
}

function stateMatchesTier(s) {
  if (activeFilter === "all") return true;
  if (activeFilter === "tnone") return s.tiers.length === 0 || s.tiers.every(function(t) { return !t || t === "None"; });
  return s.tiers.some(function(t) { return tierKey(t) === activeFilter; });
}

// ── Render list ───────────────────────────────────────────────────────────────
function renderList() {
  var container = document.getElementById("state-list");
  container.innerHTML = "";
  var filtered = STATES.filter(function(s) {
    return (!searchQuery || s.name.toLowerCase().indexOf(searchQuery) >= 0)
      && stateMatchesTier(s) && stateMatchesRev(s) && stateMatchesGrad(s);
  });
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty"><div style="font-size:40px;margin-bottom:12px;">\ud83d\uddfa\ufe0f</div><div>No states match</div></div>';
    return;
  }
  var lastLetter = "";
  filtered.forEach(function(s) {
    var letter = s.name[0];
    if (letter !== lastLetter) {
      var lbl = document.createElement("div"); lbl.className = "section-label"; lbl.textContent = letter;
      container.appendChild(lbl); lastLetter = letter;
    }
    var item = document.createElement("div"); item.className = "state-item";
    item.onclick = function() { showDetail(s); };
    var iconWrap = document.createElement("div"); iconWrap.className = "state-icon-wrap";
    if (s.icon) {
      var img = document.createElement("img"); img.src = "https://raw.githubusercontent.com/sleav89/DS4E_Nat_Tracker/main/state-icons/" + s.icon + ".png"; img.alt = ""; img.onerror = function(){ this.style.display="none"; };
      img.onerror = function() { iconWrap.innerHTML = '<div class="state-icon-dc" style="font-size:10px;">' + s.name.substring(0,2) + "</div>"; };
      iconWrap.appendChild(img);
    } else { iconWrap.innerHTML = '<div class="state-icon-dc">DC</div>'; }
    var info = document.createElement("div"); info.className = "state-info";
    var nameRow = document.createElement("div"); nameRow.className = "state-name-row";
    var nameSpan = document.createElement("span"); nameSpan.className = "state-name"; nameSpan.textContent = s.name;
    var updSpan = document.createElement("span"); updSpan.className = "state-updated"; updSpan.textContent = s.updated;
    nameRow.appendChild(nameSpan); nameRow.appendChild(updSpan);
    var tierRowDiv = document.createElement("div"); tierRowDiv.className = "tier-row";
    var validTiers = s.tiers.filter(function(t) { return t && t !== "None"; });
    var uniqueTierKeys = uniqueMap(validTiers, tierKey);
    if (uniqueTierKeys.length === 0) { var dot = document.createElement("span"); dot.className = "tdot dtnone"; tierRowDiv.appendChild(dot); }
    else { uniqueTierKeys.forEach(function(tk) { var dot = document.createElement("span"); dot.className = "tdot d" + tk; tierRowDiv.appendChild(dot); }); }
    var sep = document.createElement("span"); sep.className = "goal-sep"; sep.textContent = "\u2192"; tierRowDiv.appendChild(sep);
    var validGoals = s.goals.filter(function(g) { return g && g !== "None"; });
    var uniqueGoalKeys = uniqueMap(validGoals, tierKey);
    if (uniqueGoalKeys.length === 0) { var gdot = document.createElement("span"); gdot.className = "goal-dot"; gdot.style.borderColor = "#aaa"; gdot.style.marginLeft = "4px"; tierRowDiv.appendChild(gdot); }
    else { uniqueGoalKeys.forEach(function(gk) { var gdot = document.createElement("span"); gdot.className = "goal-dot"; gdot.style.borderColor = goalDotColor(gk); gdot.style.marginLeft = "4px"; tierRowDiv.appendChild(gdot); }); }
    var tierTexts = validTiers.length > 0 ? uniqueMap(validTiers, tierLabel).join(" + ") : "None";
    var goalTexts = validGoals.length > 0 ? uniqueMap(validGoals, tierLabel).join(" + ") : "None";
    var txtSpan = document.createElement("span"); txtSpan.className = "tier-text"; txtSpan.textContent = " " + tierTexts + " \u2192 " + goalTexts; tierRowDiv.appendChild(txtSpan);
    if (s.mathStatusOverride) {
      var badge = document.createElement("span");
      badge.className = "std-status-badge " + stdBadgeClass(s.mathStatusOverride);
      badge.textContent = mathStatusLabel(s.mathStatusOverride);
      tierRowDiv.appendChild(badge);
    }
    info.appendChild(nameRow); info.appendChild(tierRowDiv);
    var chev = document.createElement("div"); chev.className = "chevron";
    chev.innerHTML = '<svg width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1 1L7 6.5L1 12" stroke="#C7C7CC" stroke-width="2" stroke-linecap="round"/></svg>';
    item.appendChild(iconWrap); item.appendChild(info); item.appendChild(chev);
    container.appendChild(item);
  });
}

// ── Detail view ───────────────────────────────────────────────────────────────
var DETAIL_TABS = [
  {id:"overview", label:"Overview"},
  {id:"adoption", label:"Adoption"},
  {id:"standards", label:"Standards"},
];

function showDetail(s) {
  currentDetailState = s;
  document.getElementById("map-view").style.display = "none";
  document.getElementById("list-view").style.display = "none";
  var dv = document.getElementById("detail-view"); dv.style.display = "flex";
  document.getElementById("detail-header-name").textContent = s.name;
  updateLockUI();
  window.scrollTo(0, 0);
  renderDetailHero(s, null);
  document.getElementById("detail-tab-bar").innerHTML = "";
  document.getElementById("detail-tab-contents").innerHTML = '<div class="loading-card"><div class="loading-spinner"></div><div>Loading state data...</div></div>';
  if (STATE_CACHE[s.name]) {
    onDataLoaded(s, STATE_CACHE[s.name]);
  } else {
    fetchStateData(s.name, function(fetched, err) {
      if (err && !fetched) {
        document.getElementById("detail-tab-contents").innerHTML =
          '<div class="loading-card" style="color:#e05252;">Could not load sheet data: ' + esc(err) +
          '<br><br><small style="color:#888;">Make sure the Google Sheet is published to the web and the tab name matches exactly.</small></div>';
        STATE_CACHE[s.name] = {};
        return;
      }
      STATE_CACHE[s.name] = fetched || {};
      onDataLoaded(s, STATE_CACHE[s.name]);
    });
  }
}

function onDataLoaded(s, fetched) {
  renderDetailHero(s, fetched);
  renderDetailTabs(s, fetched);
  switchDetailTab("overview");
}

function goBack() {
  document.getElementById("detail-view").style.display = "none";
  switchTab("map");
}

function renderDetailHero(s, fetched) {
  var area = document.getElementById("detail-hero-area");
  var agency = (fetched && fetched.agency) ? fetched.agency : "";
  var iconHtml = s.icon
    ? '<div class="detail-state-icon"><img src="https://raw.githubusercontent.com/sleav89/DS4E_Nat_Tracker/main/state-icons/' + esc(s.icon) + '.png" alt="" style="width:64px;height:64px;object-fit:contain;display:block;"></div>'
    : '<div class="detail-dc-icon">DC</div>';
  area.innerHTML = '<div class="detail-hero">' + iconHtml
    + '<div class="detail-state-name">' + esc(s.name) + "</div>"
    + '<div class="detail-agency">' + esc(agency) + "</div>"
    + '<div class="detail-updated"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#f9c6a4" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> Updated ' + esc(s.updated) + "</div>"
    + "</div>";
}

function renderDetailTabs(s, fetched) {
  var bar = document.getElementById("detail-tab-bar");
  bar.innerHTML = "";
  DETAIL_TABS.forEach(function(t) {
    var btn = document.createElement("div");
    btn.className = "tab-btn"; btn.id = "dtab-" + t.id; btn.textContent = t.label;
    btn.onclick = function() { switchDetailTab(t.id); };
    bar.appendChild(btn);
  });
  var contents = document.getElementById("detail-tab-contents");
  contents.innerHTML = "";
  DETAIL_TABS.forEach(function(t) {
    var div = document.createElement("div");
    div.className = "tab-content"; div.id = "dtcontent-" + t.id;
    div.innerHTML = renderTabContent(t.id, s, fetched);
    contents.appendChild(div);
  });
}

function switchDetailTab(id) {
  DETAIL_TABS.forEach(function(t) {
    var btn = document.getElementById("dtab-" + t.id);
    var cnt = document.getElementById("dtcontent-" + t.id);
    if (btn) btn.className = "tab-btn" + (t.id === id ? " active" : "");
    if (cnt) cnt.className = "tab-content" + (t.id === id ? " active" : "");
  });
}

function renderTabContent(tabId, s, fetched) {
  if (tabId === "overview")  return renderOverview(s, fetched);
  if (tabId === "adoption")  return renderAdoption(s, fetched);
  if (tabId === "standards") return renderStandards(s, fetched);
  return "";
}

    if (fetched.gradCredits) h += esc(fetched.gradCredits) + " math credits";
    if (fetched.gradCredits && fetched.gradCoursework) h += " &middot; ";

  }

  if (fetched && fetched.comments) {
    h += '<div class="card"><div class="card-header">Notes</div>';
    h += '<div class="card-row"><div class="row-value">' + esc(fetched.comments).replace(/\n/g,"<br>") + "</div></div></div>";
  }

  if (fetched && fetched.usefulLinks) {
    h += '<div class="card"><div class="card-header">Useful Links</div><div class="card-row"><div class="row-value">';

  h += '<div class="card"><div class="card-header">Adoption Overview</div>';

  h += "</div>";

  // Course codes
  if (fetched && fetched.courseCodesRaw) {
    var codes = parseCourseCodesRaw(fetched.courseCodesRaw);
    if (codes.length > 0) {
      h += '<div class="card"><div class="card-header">Course Codes</div>';
      codes.forEach(function(cc) { h += '<div class="code-row"><div class="code-num">' + esc(cc.code) + '</div><div class="code-title">' + esc(cc.title) + "</div></div>"; });
      if (fetched.courseCategory) h += '<div class="card-row"><div class="row-label">Category</div><div class="row-value">' + esc(fetched.courseCategory).replace(/\n/g,", ") + "</div></div>";
      if (fetched.linkCatalog) h += '<div class="card-row"><div class="row-label">Course catalog</div><div class="row-value"><a class="useful-link" href="' + esc(fetched.linkCatalog) + '" target="_blank" rel="noopener">View catalog</a></div></div>';
      h += "</div>";
    }
  }

  // Grad requirements
  if (fetched && (fetched.gradCredits || fetched.gradCoursework)) {
    h += '<div class="card"><div class="card-header">Graduation Requirements</div>';
    if (fetched.gradCredits) h += '<div class="card-row"><div class="row-label">Math credits required</div><div class="row-value">' + esc(fetched.gradCredits) + "</div></div>";
    if (fetched.gradCoursework) h += '<div class="card-row"><div class="row-label">Required coursework</div><div class="row-value">' + esc(fetched.gradCoursework).replace(/\n/g,"<br>") + "</div></div>";
    if (fetched.gradReqResources) h += '<div class="card-row"><div class="row-label">Resources</div><div class="row-value">' + esc(fetched.gradReqResources).replace(/\n/g,"<br>") + "</div></div>";
    h += "</div>";
  }

  // Timeline (public + confidential merged)
  var pubEvents = (fetched && fetched.timeline) ? fetched.timeline : [];
  var confEvents = (priv && priv.confEvents) ? priv.confEvents : [];
  if (pubEvents.length > 0 || confEvents.length > 0) {
    h += '<div class="card"><div class="card-header">Year-by-Year Timeline</div>';
    // Build combined map by year
    var yearMap = {};
    pubEvents.forEach(function(e) { yearMap[e.year] = {year:e.year, pub:e, conf:null}; });
    confEvents.forEach(function(e) {
      if (yearMap[e.year]) yearMap[e.year].conf = e;
      else yearMap[e.year] = {year:e.year, pub:null, conf:e};
    });
    var years = Object.keys(yearMap).sort();
    years.forEach(function(yr) {
      var entry = yearMap[yr];
      h += '<div class="timeline-item"><div class="tl-year">' + esc(yr) + "</div>";
      if (entry.pub) h += '<div class="tl-text">' + esc(entry.pub.event).replace(/\n/g,"<br>") + "</div>";
      if (entry.conf) {
        h += '<div class="tl-conf"><div class="tl-conf-label">&#x1F512; Confidential</div>';
        h += '<div class="tl-text">' + esc(entry.conf.notes).replace(/\n/g,"<br>") + "</div></div>";
      }
      h += "</div>";
    });
    h += "</div>";
  }

  // Contacts (private)
  if (priv && priv.contacts && priv.contacts.length > 0) {
    h += '<div class="card card-private"><div class="card-header"><span class="private-badge">&#x1F512; Points of Contact</span></div>';
    priv.contacts.forEach(function(c) {
      h += '<div class="contact-row">';
      if (c.first || c.last) h += '<div class="contact-name">' + esc(c.first + " " + c.last).trim() + "</div>";
      if (c.title) h += '<div class="contact-title">' + esc(c.title) + "</div>";
      if (c.email) h += '<div class="contact-email"><a href="mailto:' + esc(c.email) + '">' + esc(c.email) + "</a></div>";
      if (c.role) h += '<div><span class="contact-role">' + esc(c.role) + "</span></div>";
      if (c.notes) h += '<div class="contact-notes">' + esc(c.notes).replace(/\n/g,"<br>") + "</div>";
      h += "</div>";
    });
    h += "</div>";
  }

  return h;
}

// ── STANDARDS TAB ─────────────────────────────────────────────────────────────

}

// ── Password / lock UI ────────────────────────────────────────────────────────
function showPasswordModal() {
  document.getElementById("password-modal").style.display = "flex";
  document.getElementById("pw-input").value = "";
  document.getElementById("pw-error").textContent = "";
  document.getElementById("pw-submit").disabled = false;
  document.getElementById("pw-submit").textContent = "Unlock";
  setTimeout(function() { document.getElementById("pw-input").focus(); }, 100);
}
function hidePasswordModal() {
  document.getElementById("password-modal").style.display = "none";
}
function submitPassword() {
  var pw = document.getElementById("pw-input").value.trim();
  if (!pw) { document.getElementById("pw-error").textContent = "Please enter a password."; return; }
  var btn = document.getElementById("pw-submit");
  btn.disabled = true; btn.textContent = "Checking...";
  document.getElementById("pw-error").textContent = "";
  fetchPrivateData(pw, function(data, err) {
    if (err || !data) {
      document.getElementById("pw-error").textContent = err === "Invalid password" ? "Incorrect password." : "Could not connect. Try again.";
      btn.disabled = false; btn.textContent = "Unlock"; return;
    }
    PRIVATE_DATA = data;
    PRIVATE_UNLOCKED = true;
    hidePasswordModal();
    updateLockUI();
    // Re-render current state detail if one is open
    if (currentDetailState && STATE_CACHE[currentDetailState.name]) {
      renderDetailTabs(currentDetailState, STATE_CACHE[currentDetailState.name]);
      switchDetailTab("overview");
    }
  });
}
function updateLockUI() {
  var btn = document.getElementById("lock-btn");
  if (!btn) return;
  if (PRIVATE_UNLOCKED) {
    btn.className = "lock-btn unlocked";
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg> Unlocked';
    btn.onclick = null;
  } else {
    btn.className = "lock-btn";
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Private';
    btn.onclick = showPasswordModal;
  }
}

  "FL":"Florida","GA":"Georgia","HI":"Hawaii","ID":"Idaho","IL":"Illinois",
  "IN":"Indiana","IA":"Iowa","KS":"Kansas","KY":"Kentucky","LA":"Louisiana",
  "ME":"Maine","MD":"Maryland","MA":"Massachusetts","MI":"Michigan","MN":"Minnesota",
  "MS":"Mississippi","MO":"Missouri","MT":"Montana","NE":"Nebraska","NV":"Nevada",
  "NH":"New Hampshire","NJ":"New Jersey","NM":"New Mexico","NY":"New York",
  "NC":"North Carolina","ND":"North Dakota","OH":"Ohio","OK":"Oklahoma","OR":"Oregon",
  "PA":"Pennsylvania","RI":"Rhode Island","SC":"South Carolina","SD":"South Dakota",
  "TN":"Tennessee","TX":"Texas","UT":"Utah","VT":"Vermont","VA":"Virginia",
  "WA":"Washington","WV":"West Virginia","WI":"Wisconsin","WY":"Wyoming"

function tierNum(t) { if (!t || t === "None") return -1; var m = t.match(/Tier (\d)/); return m ? parseInt(m[1]) : -1; }
var STATE_ABBR_DATA = {};
STATES.forEach(function(s) {
  var abbr = null;
  var keys = Object.keys(ABBR_TO_NAME);
  for (var i = 0; i < keys.length; i++) { if (ABBR_TO_NAME[keys[i]] === s.name) { abbr = keys[i]; break; } }
  if (abbr) {
    var nums = s.tiers.map(tierNum); nums.push(-1);
    var highest = Math.max.apply(null, nums);
    STATE_ABBR_DATA[abbr] = {tier:highest, name:s.name};
  }
});
var FIPS_TO_ABBR = {
  "01":"AL","02":"AK","04":"AZ","05":"AR","06":"CA","08":"CO","09":"CT",
  "10":"DE","11":"DC","12":"FL","13":"GA","15":"HI","16":"ID","17":"IL",
  "18":"IN","19":"IA","20":"KS","21":"KY","22":"LA","23":"ME","24":"MD",
  "25":"MA","26":"MI","27":"MN","28":"MS","29":"MO","30":"MT","31":"NE",
  "32":"NV","33":"NH","34":"NJ","35":"NM","36":"NY","37":"NC","38":"ND",
  "39":"OH","40":"OK","41":"OR","42":"PA","44":"RI","45":"SC","46":"SD",
  "47":"TN","48":"TX","49":"UT","50":"VT","51":"VA","53":"WA","54":"WV",
  "55":"WI","56":"WY"
};

function renderMap(container, us) {
  container.innerHTML = "";
  var svg = d3.select(container).append("svg")
    .attr("width", "100%")
    .attr("viewBox", "0 0 975 610")
    .attr("preserveAspectRatio", "xMidYMid meet")
    .style("display", "block");
  var path = d3.geoPath();
  var features = topojson.feature(us, us.objects.states).features;
  svg.selectAll("path")
    .data(features)
    .enter().append("path")
    .attr("d", path)
    .style("fill", function(d) {
      var fips = String(d.id);
      while (fips.length < 2) fips = "0" + fips;
      var abbr = FIPS_TO_ABBR[fips];
      if (!abbr) return "#e0e0e0";
      var stData = STATE_ABBR_DATA[abbr];
      if (!stData) return "#e0e0e0";
      return TIER_FILL[stData.tier] || "#b8b6b6";
    })
    .style("stroke", "#fff").style("stroke-width", "0.5").style("cursor", "pointer")
    .on("mouseover", function() { d3.select(this).style("opacity", "0.75"); })
    .on("mouseout", function() { d3.select(this).style("opacity", "1"); })
    .on("click", function(event, d) {
      var fips = String(d.id);
      while (fips.length < 2) fips = "0" + fips;
      var abbr = FIPS_TO_ABBR[fips];
      if (!abbr) return;
      var stData = STATE_ABBR_DATA[abbr];
      if (!stData) return;
      var s = null;
      for (var i = 0; i < STATES.length; i++) {
        if (STATES[i].name === stData.name) { s = STATES[i]; break; }
      }
      if (s) showDetail(s);
    });
}

function initMap() {
  var container = document.getElementById("us-map-container");
  container.innerHTML = '<div style="text-align:center;padding:40px;color:#aaa;">Loading map...</div>';
  fetch("https://cdn.jsdelivr.net/npm/us-atlas@3/states-albers-10m.json")
    .then(function(r) { return r.json(); })
    .then(function(us) { renderMap(container, us); })
    .catch(function(err) {
      container.innerHTML = '<div style="text-align:center;padding:40px;color:#e05252;">Map could not be loaded.</div>';
    });
}

// ── Nav ───────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  var mapV = document.getElementById("map-view");
  var listV = document.getElementById("list-view");
  var nm = document.getElementById("nav-map"), ns = document.getElementById("nav-states");
  var nm2 = document.getElementById("nav-map2"), ns2 = document.getElementById("nav-states2");
  if (tab === "map") {
    mapV.style.display = "flex"; listV.style.display = "none";
    if (nm) nm.className = "nav-tab active"; if (ns) ns.className = "nav-tab";
    if (nm2) nm2.className = "nav-tab active"; if (ns2) ns2.className = "nav-tab";
  } else {
    mapV.style.display = "none"; listV.style.display = "block";
    if (nm) nm.className = "nav-tab"; if (ns) ns.className = "nav-tab active";
    if (nm2) nm2.className = "nav-tab"; if (ns2) ns2.className = "nav-tab active";
  }
  window.scrollTo(0, 0);
}

// ── Init ──────────────────────────────────────────────────────────────────────
buildFilters();
renderList();
initMap();
</script>
