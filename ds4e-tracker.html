<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>DS4E Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f2f2f7;color:#1c1c1e;overscroll-behavior:none;}

/* ── HEADER ── */
.app-header{background:#4c4c4c;padding:12px 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;flex-shrink:0;}
.ds4e-badge{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.ds4e-badge-l{background:#ef4a23;color:#fff;font-weight:700;font-size:13px;padding:4px 7px;border-radius:4px 0 0 4px;line-height:1;}
.ds4e-badge-r{background:#fff;color:#4c4c4c;font-weight:700;font-size:9px;padding:4px 5px;border-radius:0 4px 4px 0;line-height:1.2;text-transform:uppercase;letter-spacing:0.5px;}
.header-title{color:#fff;font-size:14px;font-weight:600;flex:1;}
.back-btn{color:#ef4a23;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:4px;margin-right:6px;}

/* ── BOTTOM NAV ── */
.bottom-nav{display:flex;background:#fff;border-top:0.5px solid #ddd;padding:6px 0 10px;flex-shrink:0;position:sticky;bottom:0;z-index:100;}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#888;cursor:pointer;padding:4px 0;}
.nav-tab.active{color:#ef4a23;}
.nav-tab svg{width:22px;height:22px;}

/* ── MAP VIEW ── */
#map-view{height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.map-hint{padding:6px 14px;font-size:11px;color:#888;background:#fff;border-bottom:0.5px solid #f0f0f0;flex-shrink:0;}
.map-container{flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;}
#us-map-container{width:100%;height:100%;display:flex;align-items:center;}
.map-legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:8px 14px;background:#fff;border-top:0.5px solid #e5e5e5;font-size:11px;color:#555;flex-shrink:0;}
.map-legend-item{display:flex;align-items:center;gap:5px;}
.map-legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0;}

/* ── LIST VIEW ── */
#list-view{display:none;min-height:100vh;}
.search-section{background:#fff;border-bottom:0.5px solid #e0e0e0;padding:10px 12px 8px;position:sticky;top:56px;z-index:99;}
.search-wrap{position:relative;}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#888;}
.search-input{width:100%;border:0.5px solid #ddd;border-radius:10px;padding:8px 12px 8px 34px;font-size:15px;background:#f2f2f7;color:#1c1c1e;outline:none;}
.search-input::placeholder{color:#aaa;}
.filter-row{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.chip{border-radius:20px;padding:5px 12px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent;cursor:pointer;flex-shrink:0;}
.chip-all{background:#ef4a23;color:#fff;border-color:#ef4a23;}
.chip-all.inactive{background:#fff;color:#ef4a23;border-color:#ef4a23;}
.chip-t4{background:#7c2d12;color:#fff;border-color:#7c2d12;}
.chip-t4.inactive{background:#fff;color:#7c2d12;border-color:#7c2d12;}
.chip-t3{background:#ef4a23;color:#fff;border-color:#ef4a23;}
.chip-t3.inactive{background:#fff;color:#ef4a23;border-color:#ef4a23;}
.chip-t2{background:#f9c6a4;color:#993c1d;border-color:#d97a4a;}
.chip-t2.inactive{background:#fff;color:#993c1d;border-color:#d97a4a;}
.chip-t1{background:#6290c8;color:#fff;border-color:#6290c8;}
.chip-t1.inactive{background:#fff;color:#185fa5;border-color:#6290c8;}
.chip-t0{background:#b8b6b6;color:#fff;border-color:#aaa;}
.chip-t0.inactive{background:#fff;color:#555;border-color:#aaa;}
.chip-tnone{background:#888;color:#fff;border-color:#888;}
.chip-tnone.inactive{background:#fff;color:#555;border-color:#aaa;}
.chip-rev{background:#6290c8;color:#fff;border-color:#6290c8;}
.chip-rev.inactive{background:#fff;color:#185fa5;border-color:#6290c8;}
.chip-grad{background:#72668A;color:#fff;border-color:#72668A;}
.chip-grad.inactive{background:#fff;color:#72668A;border-color:#72668A;}
.filter-group-label{font-size:10px;color:#aaa;padding:4px 2px 0;white-space:nowrap;flex-shrink:0;align-self:center;}
.section-label{background:#f2f2f7;padding:5px 16px;font-size:12px;color:#888;font-weight:500;border-bottom:0.5px solid #e5e5e5;}
.state-item{background:#fff;border-bottom:0.5px solid #f0f0f0;padding:10px 14px 10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.state-item:active{background:#f8f8f8;}
.state-icon-wrap{width:40px;height:40px;flex-shrink:0;}
.state-icon-wrap img{width:40px;height:40px;object-fit:contain;display:block;}
.state-icon-dc{width:40px;height:40px;background:#4c4c4c;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;}
.state-info{flex:1;min-width:0;}
.state-name-row{display:flex;align-items:baseline;justify-content:space-between;gap:6px;}
.state-name{font-size:15px;font-weight:500;color:#1c1c1e;}
.state-updated{font-size:10px;color:#aaa;white-space:nowrap;}
.tier-row{display:flex;align-items:center;gap:3px;margin-top:3px;flex-wrap:wrap;}
.tdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block;}
.dt4{background:#7c2d12;}.dt3{background:#ef4a23;}.dt2{background:#f9c6a4;border:1px solid #d97a4a;}
.dt1{background:#6290c8;}.dt0{background:#b8b6b6;}.dtnone{background:#b8b6b6;}
.tier-text{font-size:10px;color:#888;}
.goal-sep{font-size:10px;color:#ccc;margin:0 1px;}
.goal-dot{width:9px;height:9px;border-radius:50%;border:1.5px dashed;flex-shrink:0;display:inline-block;}
.chevron{color:#c7c7cc;flex-shrink:0;}
.std-status-badge{font-size:9px;font-weight:600;padding:2px 6px;border-radius:10px;margin-left:4px;}
.ssb-process{background:#ddeaf8;color:#185fa5;}
.ssb-finalized{background:#e1f5ee;color:#0f6e56;}
.ssb-pause{background:#fef3e2;color:#92400e;}
.ssb-watch{background:#fde8e8;color:#a32d2d;}
.ssb-draft{background:#f3e8ff;color:#6b21a8;}
.list-legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:10px 14px;background:#fff;border-top:0.5px solid #f0f0f0;font-size:11px;color:#666;}
.list-legend-item{display:flex;align-items:center;gap:4px;}
.empty{text-align:center;padding:48px 24px;color:#aaa;}

/* ── DETAIL VIEW ── */
#detail-view{display:none;flex-direction:column;min-height:100vh;}
.detail-hero{background:#4c4c4c;padding:14px 16px 16px;flex-shrink:0;}
.detail-state-icon{width:64px;height:64px;margin-bottom:10px;display:block;}
.detail-state-icon img{width:64px;height:64px;object-fit:contain;display:block;}
.detail-dc-icon{width:64px;height:64px;background:#ef4a23;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:22px;margin-bottom:10px;}
.detail-state-name{color:#fff;font-size:20px;font-weight:600;}
.detail-agency{color:#b8b6b6;font-size:11px;margin-top:2px;}
.detail-updated{color:#f9c6a4;font-size:11px;margin-top:4px;display:flex;align-items:center;gap:4px;}

/* ── TAB BAR ── */
.tab-bar{display:flex;background:#fff;border-bottom:0.5px solid #e0e0e0;overflow-x:auto;flex-shrink:0;scrollbar-width:none;position:sticky;top:56px;z-index:98;}
.tab-bar::-webkit-scrollbar{display:none;}
.tab-btn{padding:10px 16px;font-size:13px;font-weight:500;color:#888;white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent;flex-shrink:0;}
.tab-btn.active{color:#ef4a23;border-bottom-color:#ef4a23;}
.tab-content{display:none;padding:12px;flex-direction:column;gap:10px;}
.tab-content.active{display:flex;}

/* ── CARDS ── */
.card{background:#fff;border-radius:12px;border:0.5px solid #e5e5e5;overflow:hidden;}
.card-header{padding:9px 14px;border-bottom:0.5px solid #f0f0f0;font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.5px;background:#fafafa;}
.card-row{padding:8px 14px;border-bottom:0.5px solid #f5f5f5;}
.card-row:last-child{border-bottom:none;}
.row-label{font-size:11px;color:#888;margin-bottom:2px;}
.row-value{font-size:13px;color:#1c1c1e;line-height:1.5;}
.row-value.muted{color:#aaa;font-style:italic;}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;}
.pill{display:inline-block;border-radius:5px;padding:3px 8px;font-size:11px;font-weight:500;}
.pill-t4{background:#7c2d12;color:#fff;}.pill-t3{background:#ef4a23;color:#fff;}
.pill-t2{background:#f9c6a4;color:#993c1d;}.pill-t1{background:#ddeaf8;color:#185fa5;}
.pill-t0{background:#f0f0f0;color:#666;}.pill-tnone{background:#f0f0f0;color:#666;}
.pill-goal{background:#e1f5ee;color:#0f6e56;border:1px dashed #66c2a4;}

/* ── OVERVIEW STATUS CARD ── */
.overview-status{display:flex;align-items:center;gap:10px;padding:12px 14px;}
.ov-status-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.ov-status-label{font-size:14px;font-weight:600;color:#1c1c1e;}
.ov-status-sub{font-size:11px;color:#888;margin-top:1px;}

/* ── STANDARDS STATUS ── */
.std-status-row{display:flex;align-items:flex-start;gap:10px;padding:8px 14px;border-bottom:0.5px solid #f5f5f5;}
.std-status-row:last-child{border-bottom:none;}
.std-status-indicator{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px;}
.si-process{background:#6290c8;}.si-finalized{background:#66c2a4;}.si-pause{background:#f9c6a4;}
.si-watch{background:#ef4a23;}.si-draft{background:#8B2D76;}.si-stable{background:#b8b6b6;}
.std-status-info{flex:1;}
.std-status-title{font-size:13px;font-weight:500;color:#1c1c1e;}
.std-status-detail{font-size:11px;color:#888;margin-top:2px;line-height:1.4;}

/* ── TIMELINE ── */
.timeline-item{padding:8px 14px;border-bottom:0.5px solid #f5f5f5;display:grid;grid-template-columns:52px 1fr;gap:8px;}
.timeline-item:last-child{border-bottom:none;}
.tl-year{font-size:11px;font-weight:600;color:#ef4a23;padding-top:1px;}
.tl-text{font-size:12px;color:#444;line-height:1.5;}

/* ── COURSE CODES ── */
.code-row{padding:7px 14px;border-bottom:0.5px solid #f5f5f5;display:flex;gap:10px;align-items:flex-start;}
.code-row:last-child{border-bottom:none;}
.code-num{font-size:11px;font-weight:600;color:#6290c8;min-width:50px;font-family:monospace;padding-top:1px;flex-shrink:0;}
.code-title{font-size:12px;color:#333;line-height:1.4;}

/* ── STD SUBJECT ROW ── */
.std-row{padding:7px 14px;border-bottom:0.5px solid #f5f5f5;display:grid;grid-template-columns:60px 1fr;gap:8px;align-items:start;}
.std-row:last-child{border-bottom:none;}
.std-subj{font-size:11px;font-weight:600;color:#555;padding-top:1px;}
.std-detail{font-size:12px;color:#444;line-height:1.4;}
.std-year{color:#ef4a23;font-weight:600;}
.std-rev{display:inline-block;margin-top:2px;font-size:10px;color:#888;font-style:italic;}
.std-rev.in-rev{color:#0f6e56;}
</style>
</head>

ap's professional learning cohorts and implementing their free resources will meet this requirement."}], "icon": "Oklahoma"}, {"name": "Oregon", "agency": "Oregon Department of Education", "updated": "Jun 30, 2026", "statewide": "Yes", "tiers": ["Tier 4: Graduation Requirement", "Tier 3: Standards Adoption"], "goals": ["Tier 4: Graduation Requirement"], "typeAdoption": "Standards Incorporation", "contentAreas": "Math", "gradeBand": "High School", "comments": "In 2022, the Oregon Math Project 2+1 Model was released as an official update to state standards and learning guidelines for districts statewide. The model specifies that all students learn a full year of Algebra, a semester of Geometry, and a semester of Data Analysis before 10th grade. In 11th and 12th grade, students are able to select from multiple mathematics course sequences, which includes a two-course pathway for data science & statistics and/or AP Statistics. The state also approved a $2 million program for curricula support, educator training, and other technical assistance to local schools & districts for implementing the new standards. An opt-in teacher training cohort began Summer 2022 and will run during the 2022-2023 school year. As of February 2026, the Math Pathways grants for the 2025\u20132027 biennium were fully executed and are now available for districts to use.\n\nOregon University has inclusive language around admissions. This may serve as a useful basis when having conversations about admissions with other higher education institutions.\n\nAs part of the Math Pathways grant work, Oregon is developing MTH 108: Data Science Explorations, a new college-level data science course being piloted with community colleges. Oregon did not previously have a 100-level data science course option. MTH 108 is designed to bridge high school data science experiences with college-level expectations, and is being developed with contributions from faculty at Clackamas Community College and Portland State University. In the next biennium, grant funding is anticipated to expand to support middle school implementation, including adoption of materials aligned to the data science components of the new standards.", "internal": "", "courseCodes": [], "courseCategory": "", "gradCredits": "3.0", "gradCoursework": "Algebra I", "gradFilter": "has_req", "standards": {"math": {"alignment": "Modified CCSS alignment", "year": "2021", "revision": "Revision scheduled 2027-2028"}, "ela": {"alignment": "Aligned to CCSS", "year": "2019", "revision": "Revision scheduled 2026-2027"}, "socialStudies": {"alignment": "", "year": "2024", "revision": ""}, "science": {"alignment": "Aligned to NGSS", "year": "2022", "revision": "Revision scheduled 2028-2029"}, "cs": {"alignment": "", "year": "", "revision": ""}, "revisionCycle": "No Revision Cycle", "additionalComments": ""}, "mathStatusOverride": "", "mathLastNext": "Oct 2021 / ~2028", "mathNotable": "", "standardsNotes": "", "standardsLink": "", "timeline": [{"year": "SY 2021", "notes": "In 2022, the Oregon Math Project 2+1 Model was released as an official update to state standards and learning guidelines for districts statewide. The model specifies that all students learn a full year of Algebra, a semester of Geometry, and a semester of Data Analysis before 10th grade. In 11th and 12th grade, students are able to select from multiple mathematics course sequences, which include a two-course pathway for data science & statistics and/or AP Statistics.\n\nThe state also approved a $2 million program for curriculum support, educator training, and other technical assistance to local schools & districts for implementing the new standards. An opt-in teacher training cohort began in Summer 2022 and will run during the 2022-2023 school year.\n\nState grant to help school districts incorporate new math course options - appropriated 2022, implemented in 2022-2023 school year"}, {"year": "SY 2024", "notes": "Oregon, along with other states, is participating in WestEd's ISQR Project."}, {"year": "SY 2025", "notes": "Oregon's Math Pathways grants for the 2025\u20132027 biennium were fully executed in February 2026 and are now available for districts to use. As part of this work, Oregon is developing MTH 108: Data Science Explorations, a new college-level data science course being piloted with community colleges, with contributions from faculty at Clackamas Community College and Portland State University. Oregon did not previously have a 100-level data science course option, and MTH 108 is designed to bridge high school data science experiences with college-level expectations. In the next biennium, grant funding is anticipated to expand to support middle school implementation, including adoption of materials aligned to the data science components of the new standards."}], "icon": "Oregon"}, {"name": "Pennsylvania", "agency": "Pennsylvania Department of Education", "updated": "Jun 30, 2026", "statewide": "Pending", "tiers": ["Tier 1: State Course Code"], "goals": ["Tier 1: State Course Code"], "typeAdoption": "Course Development", "contentAreas": "Other - STEM", "gradeBand": "K-12", "comments": "In 2022, Governor Wolf announced a $500,000 grant as part of ESSER and GEER funding allocations to develop a K-12 data science pathway & STEM course program to South Fayette Township School District. The course is currently under development (Project ASCENT).\n\nPennsylvania selected by DS4E for CTA. Will be hosted on October 2026.", "internal": "Megan shared that the board has approved a listening tour for mathematics standards revision. They will be once a month starting in July until October.", "courseCodes": [{"code": "22161", "title": "Data Science"}, {"code": "22162", "title": "Data Science Applications"}], "courseCategory": "Non Subject Specific", "gradCredits": "4.0", "gradCoursework": "Local Control", "gradFilter": "local", "standards": {"math": {"alignment": "Aligned to CCSS", "year": "2014", "revision": ""}, "ela": {" ypeAdoption": "Course Pilot", "contentAreas": "Math", "gradeBand": "High School", "comments": "Utah State Board of Education launched a pilot program for testing 4 different high school data science courses.  These courses count as an advanced mathematics course and is available for 11th and 12th graders.\n\nAdditionally, Utah has provided a microcredential option for high school teachers to learn about data science and teaching practices.", "internal": "2026.05.14 - Utah math standards are going through an internal audit cycle. Goal is to have a report for the August 2026 Board Meeting.", "courseCodes": [{"code": "07060000015", "title": "Data Science/Mathematical Modeling"}], "courseCategory": "Data Science/Mathematical Modeling", "gradCredits": "3.0", "gradCoursework": "Mathematics I, Mathematics II, Mathematics III, , Students that have completed Calculus have met graduation requirements regardless of number of credits taken.", "gradFilter": "has_req", "standards": {"math": {"alignment": "Aligned to CCSS", "year": "2016", "revision": "Currently in revision"}, "ela": {"alignment": "Aligned to CCSS", "year": "2023", "revision": ""}, "socialStudies": {"alignment": "", "year": "2016", "revision": ""}, "science": {"alignment": "Aligned to NGSS", "year": "2023", "revision": ""}, "cs": {"alignment": "", "year": "", "revision": ""}, "revisionCycle": "7 year cycle", "additionalComments": "Math was triggered in 9/23"}, "mathStatusOverride": "Pause", "mathLastNext": "Jan 2016 / Adoption likely 2026", "mathNotable": "Independent review underway, report to August 2026 Board meeting", "standardsNotes": "Standards are currently going through independent review. Goal is to have process completed for August 2026 Board meeting.", "standardsLink": "", "timeline": [{"year": "SY 2021", "notes": "In 2022, the Utah SBOE launched a micro-credential for high school teachers to learn data science techniques & teaching practices in advance of the state-wide pilot program."}, {"year": "SY 2022", "notes": "In 2023, the Utah State Board of Education launched a pilot program for testing 4 different high school data science course programs as advanced mathematics course options in 11th and 12th grades. The state is facilitating a teacher and district specialist pilot cohort that will guide Year 1 implementation during the 2023-2024 school year with 18 pilot teachers. Initial sign-ups surpassed the number of slots allocated for the pilot due to strong organic interest from local educators (50+ sign ups)."}, {"year": "SY 2023", "notes": "In the September 2023 board meeting, the board unanimously triggered the standards revision process for mathematics. \n\nIn September 2023, DS4E partnered with USBE to host a CTA."}, {"year": "SY 2024", "notes": "In 2024, Data Science cohort #2 was implemented following the same process as the 2023 cohort listed below.\n\n24 teachers in total for SY 24-25\n18 teachers from cohort 1. 2 teachers will not continue. 8 teachers will be added for cohort 2.\n\nMathematics standards are currently in revision. Standards will include data literacy/data science."}, {"year": "SY 2025", "notes": "2026.05.14 - Utah math standards are going through an internal audit cycle. Goal is to have a report for the August 2026 Board Meeting."}], "icon": "Utah"}, {"name": "Vermont", "agency": "State of Vermont Agency of Education", "updated": "Jun 30, 2026", "statewide": "No", "tiers": ["None"], "goals": ["None"], "typeAdoption": "", "contentAreas": "", "gradeBand": "", "comments": "", "internal": "", "courseCodes": [], "courseCategory": "", "gradCredits": "N/A", "gradCoursework": "Proficiency-Based Graduation Requirements", "gradFilter": "has_req", "standards": {"math": {"alignment": "Aligned to CCSS", "year": "", "revision": ""}, "ela": {"alignment": "Aligned to CCSS", "year": "", "revision": ""}, "socialStudies": {"alignment": "", "year": "", "revision": ""}, "science": {"alignment": "Aligned to NGSS", "year": "", "revision": ""}, "cs": {"alignment": "", "year": "", "revision": ""}, "revisionCycle": "No Revision Cycle", "additionalComments": ""}, "mathStatusOverride": "", "mathLastNext": "2010 CCSS / Not scheduled", "mathNotable": "", "standardsNotes": "", "standardsLink": "", "timeline": [{"year": "SY 2025", "notes": "Jan 2026 - Vermont is reviewing their graduation requirements and there is some consideration for the inclusion of DS into the math requirements."}], "icon": "Vermont"}, {"name": "Virginia", "agency": "Virginia Department of Education", "updated": "Jun 30, 2026", "statewide": "Yes", "tiers": ["Tier 3: Standards Adoption", "Tier 1: State Course Code"], "goals": ["Tier 3: Standards Adoption"], "typeAdoption": "Standards Incorporation Course Development", "contentAreas": "Math", "gradeBand": "K - 12", "comments": "In 2022, Virginia became the first state in the country to develop dedicated standards for a K-12 data science high school course. The standards were created through a multi-year effort through collaboration from the Virginia Department of Education, local school districts, state industry partners, higher education partners, and other stakeholders. \n\nFor the 2022-2023 school year, the Virginia Department of Education also approved and began implementing a full-year course pilot for a high school data science course, developed course modules (from scratch) to be shared as a voluntary resource with local schools and districts, and organized and facilitated an educator professional learning cohort during the Summer of 2022 and for continuing support during the 2022-23 schoolyear.", "internal": "", "courseCodes": [{"code": "02911", "title": "Data Science"}, {"code": "02911", "title": "Data Science I"}, {"code": "02911", "title": "Data Science II"}], "courseCategory": "Mathematics", "gradCredits": "3.0", "gradCoursework": "At least two course from the following list:, Algebra I, Geometry, Algebra Fucnctions, Data Analysis, Algebra II, Other matheamtics courses approved by board", "gradFil // ── tier helpers ────────────────────────────────────────────────────────────
function tierKey(t){
  if(!t||t==='None')return 'tnone';
  var m=t.match(/Tier (\d)/);
  if(!m)return 'tnone';
  var n=parseInt(m[1]);
  return n>=4?'t4':n===3?'t3':n===2?'t2':n===1?'t1':n===0?'t0':'tnone';
}
function tierLabel(t){
  if(!t||t==='None')return 'None';
  var m=t.match(/Tier (\d)/); return m?'Tier '+m[1]:'None';
}
function goalDotColor(tk){
  var c={t4:'#7c2d12',t3:'#ef4a23',t2:'#d97a4a',t1:'#6290c8',t0:'#b8b6b6',tnone:'#aaa'};
  return c[tk]||'#aaa';
}
function uniqueMap(arr,fn){
  var seen={},result=[];
  arr.forEach(function(x){var v=fn(x);if(!seen[v]){seen[v]=true;result.push(v);}});
  return result;
}
function esc(s){
  if(!s)return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── standards status helpers ────────────────────────────────────────────────
function stdStatusClass(status){
  if(!status)return 'si-stable';
  var s=status.toLowerCase();
  if(s.indexOf('process')>=0)return 'si-process';
  if(s.indexOf('finalized')>=0)return 'si-finalized';
  if(s.indexOf('pause')>=0)return 'si-pause';
  if(s.indexOf('watch')>=0)return 'si-watch';
  if(s.indexOf('draft')>=0)return 'si-draft';
  return 'si-stable';
}
function stdBadgeClass(status){
  if(!status)return '';
  var s=status.toLowerCase();
  if(s.indexOf('process')>=0)return 'ssb-process';
  if(s.indexOf('finalized')>=0)return 'ssb-finalized';
  if(s.indexOf('pause')>=0)return 'ssb-pause';
  if(s.indexOf('watch')>=0)return 'ssb-watch';
  if(s.indexOf('draft')>=0)return 'ssb-draft';
  return '';
}
function mathStatusLabel(s){
  if(!s)return '';
  var map={'In Process':'In Process','Finalized':'Finalized','Pause':'Paused','To Watch':'To Watch',
           'Draft / Public Comment':'Draft','Recently Revised':'Recently Revised','Stable':'Stable'};
  for(var k in map){if(s.indexOf(k)>=0)return map[k];}
  return s.split('(')[0].trim();
}

// ── filter state ────────────────────────────────────────────────────────────
var activeFilter='all';
var activeRevFilter='';
var activeGradFilter='';
var searchQuery='';

var TIER_FILTERS=['all','t4','t3','t2','t1','tnone'];
var TIER_LABELS={all:'All',t4:'Tier 4',t3:'Tier 3',t2:'Tier 2',t1:'Tier 1',tnone:'None'};
var REV_FILTERS=[{k:'revising',l:'In Revision'},{k:'scheduled',l:'Rev Scheduled'},{k:'stable',l:'Stable'}];
var GRAD_FILTERS=[{k:'has_req',l:'Has Grad Req'},{k:'local',l:'Local Control'}];

function buildFilters(){
  var row=document.getElementById('filter-row');
  row.innerHTML='';
  // Tier chips
  TIER_FILTERS.forEach(function(f){
    var chip=document.createElement('div');
    chip.className='chip chip-'+f+(f===activeFilter?'':' inactive');
    chip.textContent=TIER_LABELS[f];
    chip.onclick=function(){activeFilter=f;buildFilters();renderList();};
    row.appendChild(chip);
  });
  // Separator
  var sep=document.createElement('span');
  sep.className='filter-group-label'; sep.textContent='|';
  row.appendChild(sep);
  // Standards revision filters
  REV_FILTERS.forEach(function(f){
    var chip=document.createElement('div');
    chip.className='chip chip-rev'+(activeRevFilter===f.k?'':' inactive');
    chip.textContent=f.l;
    chip.onclick=function(){activeRevFilter=(activeRevFilter===f.k?'':f.k);buildFilters();renderList();};
    row.appendChild(chip);
  });
  // Separator
  var sep2=document.createElement('span');
  sep2.className='filter-group-label'; sep2.textContent='|';
  row.appendChild(sep2);
  // Grad filters
  GRAD_FILTERS.forEach(function(f){
    var chip=document.createElement('div');
    chip.className='chip chip-grad'+(activeGradFilter===f.k?'':' inactive');
    chip.textContent=f.l;
    chip.onclick=function(){activeGradFilter=(activeGradFilter===f.k?'':f.k);buildFilters();renderList();};
    row.appendChild(chip);
  });
}

function filterStates(){searchQuery=document.getElementById('search-input').value.toLowerCase();renderList();}

function stateMatchesTier(s){
  if(activeFilter==='all')return true;
  if(activeFilter==='tnone')return s.tiers.length===0||s.tiers.every(function(t){return !t||t==='None';});
  return s.tiers.some(function(t){return tierKey(t)===activeFilter;});
}
function stateMatchesRev(s){
  if(!activeRevFilter)return true;
  var st=(s.mathStatusOverride||'').toLowerCase();
  var std=s.standards||{};
  var mathRev=(std.math||{}).revision||'';
  if(activeRevFilter==='revising'){
    return st.indexOf('process')>=0||st.indexOf('draft')>=0||mathRev.indexOf('currently')>=0;
  }
  if(activeRevFilter==='scheduled'){
    return mathRev.indexOf('scheduled')>=0||(st.indexOf('watch')>=0);
  }
  if(activeRevFilter==='stable'){
    return st.indexOf('stable')>=0||st.indexOf('recently')>=0||st.indexOf('finalized')>=0;
  }
  return true;
}
function stateMatchesGrad(s){
  if(!activeGradFilter)return true;
  return s.gradFilter===activeGradFilter;
}

// ── render list ─────────────────────────────────────────────────────────────
function renderList(){
  var container=document.getElementById('state-list');
  container.innerHTML='';
  var filtered=STATES.filter(function(s){
    return (!searchQuery||s.name.toLowerCase().indexOf(searchQuery)>=0)
      &&stateMatchesTier(s)&&stateMatchesRev(s)&&stateMatchesGrad(s);
  });
  if(filtered.length===0){
    container.innerHTML='<div class="empty"><div style="font-size:40px;margin-bottom:12px;">🗺️</div><div>No states match</div></div>';
    return;
  }
  var lastLetter='';
  filtered.forEach(function(s){
    var letter=s.name[0];
    if(letter!==lastLetter){
      var lbl=document.createElement('div');lbl.className='section-label';lbl.textContent=letter;
      container.appendChild(lbl);lastLetter=letter;
    }
    var item=document.createElement('div');item.className='state-item';
    item.onclick=function(){showDetail(s);};
    // Icon
    var iconWrap=document.createElement('div');iconWrap.className='state-icon-wrap';
    if(s.icon){
      var img=document.createElement('img');img.src='state-icons/'+s.icon+'.png';img.alt='';
      img.onerror=function(){iconWrap.innerHTML='<div class="state-icon-dc" style="font-size:10px;">'+s.name.substring(0,2)+'</div>';};
      iconWrap.appendChild(img);
    } else {iconWrap.innerHTML='<div class="state-icon-dc">DC</div>';}
    // Info
    var info=document.createElement('div');info.className='state-info';
    var nameRow=document.createElement('div');nameRow.className='state-name-row';
    var nameSpan=document.createElement('span');nameSpan.className='state-name';nameSpan.textContent=s.name;
    var updSpan=document.createElement('span');updSpan.className='state-updated';updSpan.textContent=s.updated;
    nameRow.appendChild(nameSpan);nameRow.appendChild(updSpan);
    // Tier row
    var tierRowDiv=document.createElement('div');tierRowDiv.className='tier-row';
    var validTiers=s.tiers.filter(function(t){return t&&t!=='None';});
    var uniqueTierKeys=uniqueMap(validTiers,tierKey);
    if(uniqueTierKeys.length===0){var dot=document.createElement('span');dot.className='tdot dtnone';tierRowDiv.appendChild(dot);}
    else{uniqueTierKeys.forEach(function(tk){var dot=document.createElement('span');dot.className='tdot d'+tk;tierRowDiv.appendChild(dot);});}
    var sep=document.createElement('span');sep.className='goal-sep';sep.textContent='\u2192';tierRowDiv.appendChild(sep);
    var validGoals=s.goals.filter(function(g){return g&&g!=='None';});
    var uniqueGoalKeys=uniqueMap(validGoals,tierKey);
    if(uniqueGoalKeys.length===0){var gdot=document.createElement('span');gdot.className='goal-dot';gdot.style.borderColor='#aaa';gdot.style.marginLeft='4px';tierRowDiv.appendChild(gdot);}
    else{uniqueGoalKeys.forEach(function(gk){var gdot=document.createElement('span');gdot.className='goal-dot';gdot.style.borderColor=goalDotColor(gk);gdot.style.marginLeft='4px';tierRowDiv.appendChild(gdot);});}
    var tierTexts=validTiers.length>0?uniqueMap(validTiers,tierLabel).join(' + '):'None';
    var goalTexts=validGoals.length>0?uniqueMap(validGoals,tierLabel).join(' + '):'None';
    var txtSpan=document.createElement('span');txtSpan.className='tier-text';txtSpan.textContent=' '+tierTexts+' \u2192 '+goalTexts;tierRowDiv.appendChild(txtSpan);
    // Math status badge
    if(s.mathStatusOverride){
      var badge=document.createElement('span');
      badge.className='std-status-badge '+stdBadgeClass(s.mathStatusOverride);
      badge.textContent=mathStatusLabel(s.mathStatusOverride);
      tierRowDiv.appendChild(badge);
    }
    info.appendChild(nameRow);info.appendChild(tierRowDiv);
    var chev=document.createElement('div');chev.className='chevron';
    chev.innerHTML='<svg width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1 1L7 6.5L1 12" stroke="#C7C7CC" stroke-width="2" stroke-linecap="round"/></svg>';
    item.appendChild(iconWrap);item.appendChild(info);item.appendChild(chev);
    container.appendChild(item);
  });
}

// ── detail view ─────────────────────────────────────────────────────────────
var currentDetailState=null;

function showDetail(s){
  currentDetailState=s;
  document.getElementById('map-view').style.display='none';
  document.getElementById('list-view').style.display='none';
  var dv=document.getElementById('detail-view');dv.style.display='flex';
  document.getElementById('detail-header-name').textContent=s.name;
  window.scrollTo(0,0);
  renderDetailHero(s);
  renderDetailTabs(s);
  switchDetailTab('overview');
}

function goBack(){
  document.getElementById('detail-view').style.display='none';
  switchTab('map');
}

function renderDetailHero(s){
  var area=document.getElementById('detail-hero-area');
  var iconHtml=s.icon
    ?'<div class="detail-state-icon"><img src="state-icons/'+esc(s.icon)+'.png" alt="" style="width:64px;height:64px;object-fit:contain;display:block;"></div>'
    :'<div class="detail-dc-icon">DC</div>';
  area.innerHTML='<div class="detail-hero">'+iconHtml
    +'<div class="detail-state-name">'+esc(s.name)+'</div>'
    +'<div class="detail-agency">'+esc(s.agency)+'</div>'
    +'<div class="detail-updated"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#f9c6a4" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> Updated '+esc(s.updated)+'</div>'
    +'</div>';
}

var DETAIL_TABS=[
  {id:'overview',label:'Overview'},
  {id:'adoption',label:'Adoption'},
  {id:'standards',label:'Standards'},
];

function renderDetailTabs(s){
  var bar=document.getElementById('detail-tab-bar');
  bar.innerHTML='';
  DETAIL_TABS.forEach(function(t){
    var btn=document.createElement('div');
    btn.className='tab-btn';btn.id='dtab-'+t.id;btn.textContent=t.label;
    btn.onclick=function(){switchDetailTab(t.id);};
    bar.appendChild(btn);
  });
  var contents=document.getElementById('detail-tab-contents');
  contents.innerHTML='';
  DETAIL_TABS.forEach(function(t){
    var div=document.createElement('div');
    div.className='tab-content';div.id='dtcontent-'+t.id;
    div.innerHTML=renderTabContent(t.id,s);
    contents.appendChild(div);
  });
}

function switchDetailTab(id){
  DETAIL_TABS.forEach(function(t){
    var btn=document.getElementById('dtab-'+t.id);
    var cnt=document.getElementById('dtcontent-'+t.id);
    if(btn){btn.className='tab-btn'+(t.id===id?' active':'');}
    if(cnt){cnt.className='tab-content'+(t.id===id?' active':'');}
  });
}

function renderTabContent(tabId,s){
  if(tabId==='overview') return renderOverview(s);
  if(tabId==='adoption') return renderAdoption(s);
  if(tabId==='standards') return renderStandards(s);
  return '';
}

  h+='<div class="card-row"><div class="row-label">Implementation tier(s)</div><div class="pills">';
  if(vt.length===0){h+='<span class="pill pill-tnone">None</span>';}
  else{vt.forEach(function(t){h+='<span class="pill pill-'+tierKey(t)+'">'+esc(t)+'</span>';});}
  h+='</div></div>';
  // Statewide adoption
  h+='<div class="card-row"><div class="row-label">Statewide adoption</div><div class="row-value">'+esc(s.statewide||'—')+'</div></div>';
  // Math standards status
  h+='<div class="card-row"><div class="row-label">Math standards status</div>';
  h+='<div style="display:flex;align-items:center;gap:8px;margin-top:2px;">';
  h+='<span class="ov-status-dot '+siClass+'"></span>';
  h+='<div><div class="ov-status-label">'+esc(mathDisp)+'</div>';
  if(s.mathLastNext){h+='<div class="ov-status-sub">'+esc(s.mathLastNext)+'</div>';}
  h+='</div></div></div>';
  // Next revision window
  var nextRev='';
  if(s.standards&&s.standards.math){
    var mr=s.standards.math.revision;
    if(mr&&mr!=='No revision cycle'&&mr!=='Currently in revision')nextRev=mr;
  }
  if(nextRev){h+='<div class="card-row"><div class="row-label">Next revision window</div><div class="row-value">'+esc(nextRev)+'</div></div>';}
  // Grad requirements
  if(s.gradCredits||s.gradCoursework){
    var gc=s.gradCoursework?s.gradCoursework.replace(/,\s*,/g,',').replace(/^,|,$/g,'').trim():'';
    h+='<div class="card-row"><div class="row-label">Graduation requirements</div><div class="row-value">';
    if(s.gradCredits)h+=esc(s.gradCredits)+' math credits';
    if(s.gradCredits&&gc)h+=' · ';
    if(gc)h+=esc(gc);
    h+='</div></div>';
  }
  // Internal notes
  if(s.internal){h+='<div class="card-row"><div class="row-label">Internal notes</div><div class="row-value">'+esc(s.internal).replace(/\n/g,'<br>')+'</div></div>';}
  h+='</div>';

  // Standards live notes if any
  if(s.standardsNotes){
    h+='<div class="card"><div class="card-header">Standards Activity</div>';
    h+='<div class="card-row"><div class="row-value">'+esc(s.standardsNotes).replace(/\n/g,'<br>')+'</div></div>';
    h+='</div>';
  }
  // Notable HS features
  if(s.mathNotable){
    h+='<div class="card"><div class="card-header">Notable HS Math Features</div>';
    h+='<div class="card-row"><div class="row-value">'+esc(s.mathNotable).replace(/\n/g,'<br>')+'</div></div>';
    h+='</div>';
  }
  return h;
}

// ── ADOPTION TAB ─────────────────────────────────────────────────────────────
function renderAdoption(s){
  var h='';
  // Adoption overview card
  h+='<div class="card"><div class="card-header">Adoption overview</div>';
  h+='<div class="card-row"><div class="row-label">Statewide adoption</div><div class="row-value">'+esc(s.statewide||'—')+'</div></div>';
  var vt=s.tiers.filter(function(t){return t&&t!=='None';});
  h+='<div class="card-row"><div class="row-label">Current tier(s)</div><div class="pills">';
  if(vt.length===0){h+='<span class="pill pill-tnone">None</span>';}
  else{vt.forEach(function(t){h+='<span class="pill pill-'+tierKey(t)+'">'+esc(t)+'</span>';});}
  h+='</div></div>';
  var vg=s.goals.filter(function(g){return g&&g!=='None';});
  h+='<div class="card-row"><div class="row-label">Goal by Oct 2026</div><div class="pills">';
  if(vg.length===0){h+='<span class="pill pill-tnone">None</span>';}
  else{vg.forEach(function(g){h+='<span class="pill pill-goal">'+esc(g)+'</span>';});}
  h+='</div></div>';
  if(s.typeAdoption){h+='<div class="card-row"><div class="row-label">Type of adoption</div><div class="row-value">'+esc(s.typeAdoption)+'</div></div>';}
  if(s.contentAreas){h+='<div class="card-row"><div class="row-label">Content areas</div><div class="row-value">'+esc(s.contentAreas)+'</div></div>';}
  if(s.gradeBand){h+='<div class="card-row"><div class="row-label">Grade band</div><div class="row-value">'+esc(s.gradeBand)+'</div></div>';}
  h+='</div>';
  // Notes
  if(s.comments||s.internal){
    h+='<div class="card"><div class="card-header">Notes</div>';
    h+='<div class="card-row"><div class="row-label">Additional comments</div><div class="row-value">'+(s.comments?esc(s.comments).replace(/\n/g,'<br>'):'<span class="muted">None recorded</span>')+'</div></div>';
    h+='<div class="card-row"><div class="row-label">Internal information</div><div class="row-value">'+(s.internal?esc(s.internal).replace(/\n/g,'<br>'):'<span class="muted">None recorded</span>')+'</div></div>';
    h+='</div>';
  }
  // Course codes
  if(s.courseCodes&&s.courseCodes.length>0){
    h+='<div class="card"><div class="card-header">Course codes</div>';
    s.courseCodes.forEach(function(cc){var title=cc.title.replace(/\[SY[\s\d\-current]+\]/gi,'').trim();h+='<div class="code-row"><div class="code-num">'+esc(cc.code)+'</div><div class="code-title">'+esc(title)+'</div></div>';});
    if(s.courseCategory){var cat=s.courseCategory.replace(/,\s*,/g,',').replace(/^,|,$/g,'').trim();h+='<div class="card-row"><div class="row-label">Category</div><div class="row-value">'+esc(cat)+'</div></div>';}
    h+='</div>';
  }
  // Grad requirements
  if(s.gradCredits||s.gradCoursework){
    h+='<div class="card"><div class="card-header">Graduation requirements</div>';
    if(s.gradCredits)h+='<div class="card-row"><div class="row-label">Math credits required</div><div class="row-value">'+esc(s.gradCredits)+'</div></div>';
    if(s.gradCoursework){var cw=s.gradCoursework.replace(/,\s*,/g,',').replace(/^,\s*|,\s*$/g,'').trim();h+='<div class="card-row"><div class="row-label">Required coursework</div><div class="row-value">'+esc(cw)+'</div></div>';}
    h+='</div>';
  }
  // Timeline
  if(s.timeline&&s.timeline.length>0){
    h+='<div class="card"><div class="card-header">Year-by-year timeline</div>';
    s.timeline.forEach(function(tl){h+='<div class="timeline-item"><div class="tl-year">'+esc(tl.year)+'</div><div class="tl-text">'+esc(tl.notes).replace(/\n/g,'<br>')+'</div></div>';});
    h+='</div>';
  }
  return h;
}

// ── STANDARDS TAB ─────────────────────────────────────────────────────────────
function renderStandards(s){
  var h='';
  var std=s.standards||{};
  // Live math status
  if(s.mathStatusOverride){
    h+='<div class="card"><div class="card-header">Math Standards — Live Status</div>';
    var siClass=stdStatusClass(s.mathStatusOverride);
    h+='<div class="std-status-row">';
    h+='<div class="std-status-indicator '+siClass+'"></div>';
    h+='<div class="std-status-info">';
    h+='<div class="std-status-title">'+esc(s.mathStatusOverride)+'</div>';
    if(s.mathLastNext)h+='<div class="std-status-detail">'+esc(s.mathLastNext)+'</div>';
    if(s.standardsNotes)h+='<div class="std-status-detail" style="margin-top:4px;">'+esc(s.standardsNotes)+'</div>';
    h+='</div></div>';
    if(s.mathNotable){h+='<div class="card-row"><div class="row-label">Notable features</div><div class="row-value">'+esc(s.mathNotable)+'</div></div>';}
    h+='</div>';
  }
  // All standards by subject
  h+='<div class="card"><div class="card-header">Learning standards</div>';
  var subs=[{k:'math',l:'Math'},{k:'ela',l:'ELA'},{k:'socialStudies',l:'Soc. St.'},{k:'science',l:'Science'},{k:'cs',l:'CS'}];
  subs.forEach(function(sub){
    var d=std[sub.k];
    if(!d||(!(d.alignment)&&!(d.year)&&!(d.revision)))return;
    var detail='';
    if(d.alignment)detail+=esc(d.alignment);
    if(d.year)detail+=(d.alignment?' &middot; ':'')+'<span class="std-year">'+esc(d.year)+'</span>';
    if(d.revision){var rc='std-rev'+(d.revision.toLowerCase().indexOf('currently')>=0?' in-rev':'');detail+='<br><span class="'+rc+'">'+esc(d.revision)+'</span>';}
    h+='<div class="std-row"><div class="std-subj">'+sub.l+'</div><div class="std-detail">'+detail+'</div></div>';
  });
  if(std.revisionCycle&&std.revisionCycle.indexOf('No Revision Cycle')<0){
    h+='<div class="card-row"><div class="row-label">Revision cycle</div><div class="row-value">'+esc(std.revisionCycle.replace(/\n/g,' '))+'</div></div>';
  }
  if(std.additionalComments){h+='<div class="card-row"><div class="row-label">Standards notes</div><div class="row-value">'+esc(std.additionalComments).replace(/\n/g,'<br>')+'</div></div>';}
  h+='</div>';
  return h;
}

// ── MAP ──────────────────────────────────────────────────────────────────────
var TIER_FILL={4:'#7c2d12',3:'#ef4a23',2:'#f9c6a4',1:'#6290c8',0:'#b8b6b6'};
var ABBR_TO_NAME={
  'AL':'Alabama','AK':'Alaska','AZ':'Arizona','AR':'Arkansas','CA':'California',
  'CO':'Colorado','CT':'Connecticut','DE':'Delaware','DC':'District of Columbia',
  'FL':'Florida','GA':'Georgia','HI':'Hawaii','ID':'Idaho','IL':'Illinois',
  'IN':'Indiana','IA':'Iowa','KS':'Kansas','KY':'Kentucky','LA':'Louisiana',
  'ME':'Maine','MD':'Maryland','MA':'Massachusetts','MI':'Michigan','MN':'Minnesota',
  'MS':'Mississippi','MO':'Missouri','MT':'Montana','NE':'Nebraska','NV':'Nevada',
  'NH':'New Hampshire','NJ':'New Jersey','NM':'New Mexico','NY':'New York',
  'NC':'North Carolina','ND':'North Dakota','OH':'Ohio','OK':'Oklahoma','OR':'Oregon',
  'PA':'Pennsylvania','RI':'Rhode Island','SC':'South Carolina','SD':'South Dakota',
  'TN':'Tennessee','TX':'Texas','UT':'Utah','VT':'Vermont','VA':'Virginia',
  'WA':'Washington','WV':'West Virginia','WI':'Wisconsin','WY':'Wyoming'
};

function tierNum(t){if(!t||t==='None')return -1;var m=t.match(/Tier (\d)/);return m?parseInt(m[1]):-1;}

var STATE_ABBR_DATA={};
STATES.forEach(function(s){
  var abbr=null;
  Object.keys(ABBR_TO_NAME).forEach(function(a){if(ABBR_TO_NAME[a]===s.name)abbr=a;});
  if(abbr){
    var highest=Math.max.apply(null,s.tiers.map(tierNum).concat([-1]));
    STATE_ABBR_DATA[abbr]={tier:highest,name:s.name};
  }
});

function applyMapColors(){
  var container=document.getElementById('us-map-container');
  var svg=container.querySelector('svg');
  if(!svg)return;
  svg.style.width='100%';svg.style.height='100%';svg.style.display='block';
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  svg.querySelectorAll('text').forEach(function(el){
    if(el.textContent&&el.textContent.toLowerCase().indexOf('mapchart')>=0)el.style.display='none';
  });
  svg.querySelectorAll('a').forEach(function(el){el.style.display='none';});
  var NAME_TO_ABBR={};
  Object.keys(ABBR_TO_NAME).forEach(function(abbr){
    var name=ABBR_TO_NAME[abbr];
    NAME_TO_ABBR[name.toUpperCase()]=abbr;
    NAME_TO_ABBR[name.toUpperCase().replace(/\s+/g,'-')]=abbr;
    NAME_TO_ABBR[name.toUpperCase().replace(/\s+/g,'_')]=abbr;
    NAME_TO_ABBR['US-'+abbr]=abbr;
    NAME_TO_ABBR[abbr]=abbr;
  });
  svg.querySelectorAll('[id]').forEach(function(el){
    var rawId=(el.id||'').trim();if(!rawId)return;
    var abbr=NAME_TO_ABBR[rawId.toUpperCase()]||NAME_TO_ABBR[rawId];
    if(!abbr)return;
    var d=STATE_ABBR_DATA[abbr];if(d===undefined)return;
    var fill=TIER_FILL[d.tier]||'#b8b6b6';
    el.style.fill=fill;el.style.stroke='#ffffff';el.style.strokeWidth='0.5';el.style.cursor='pointer';
    el.onclick=function(e){
      e.stopPropagation();
      var s=STATES.find(function(x){return x.name===d.name;});
      if(s)showDetail(s);
    };
    el.onmouseover=function(){this.style.opacity='0.75';};
    el.onmouseout=function(){this.style.opacity='1';};
  });
}

function initMap(){
  var container=document.getElementById('us-map-container');
  container.innerHTML='<div style="text-align:center;padding:40px;color:#aaa;">Loading map...</div>';
  fetch('state-icons/MapChart_Map.svg')
    .then(function(r){if(!r.ok)throw new Error('Could not load map');return r.text();})
    .then(function(svgText){
      container.innerHTML=svgText;
      setTimeout(applyMapColors,50);
    })
    .catch(function(){
      container.innerHTML='<div style="text-align:center;padding:40px;color:#e05252;">Map could not be loaded.<br>Make sure MapChart_Map.svg is in the state-icons folder.</div>';
    });
}

// ── nav ──────────────────────────────────────────────────────────────────────
function switchTab(tab){
  var mapV=document.getElementById('map-view');
  var listV=document.getElementById('list-view');
  var nm=document.getElementById('nav-map'),ns=document.getElementById('nav-states');
  var nm2=document.getElementById('nav-map2'),ns2=document.getElementById('nav-states2');
  if(tab==='map'){
    mapV.style.display='flex';listV.style.display='none';
    if(nm)nm.className='nav-tab active';if(ns)ns.className='nav-tab';
    if(nm2)nm2.className='nav-tab active';if(ns2)ns2.className='nav-tab';
  } else {
    mapV.style.display='none';listV.style.display='block';
    if(nm)nm.className='nav-tab';if(ns)ns.className='nav-tab active';
    if(nm2)nm2.className='nav-tab';if(ns2)ns2.className='nav-tab active';
  }
  window.scrollTo(0,0);
}

// ── init ─────────────────────────────────────────────────────────────────────
buildFilters();
renderList();
initMap();
</script>
